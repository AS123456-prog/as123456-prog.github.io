<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="log-tracker.js"></script>
<title>JSON 格式化 | 程序员工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        header h1 {
            font-size: 1.8rem;
            color: #58a6ff;
        }
        header a {
            color: #8b949e;
            font-size: 0.9rem;
            text-decoration: none;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        textarea {
            width: 100%;
            height: 200px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            resize: vertical;
        }
        .btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        button:hover {
            background: #30363d;
        }
        .primary {
            background: #238636;
            border-color: #2ea043;
            color: #fff;
        }
        .primary:hover {
            background: #2ea043;
        }
        .error {
            color: #f85149;
            min-height: 1.2rem;
            font-size: 0.9rem;
        }
        footer {
            margin-top: 2rem;
            color: #484f58;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>📋 JSON 格式化</h1>
        <a href="index.html">← 返回工具箱</a>
    </header>

    <div class="container">
        <textarea id="input" placeholder="在此粘贴 JSON 文本..."></textarea>
        <div class="btn-group">
            <button class="primary" onclick="formatJSON()">格式化</button>
            <button onclick="compressJSON()">压缩</button>
            <button onclick="clearAll()">清空</button>
        </div>
        <div class="error" id="error"></div>
        <textarea id="output" placeholder="结果会显示在这里..." readonly></textarea>
    </div>

    <footer>
        &copy; 2026 As123456-prog | 开源在 GitHub
    </footer>

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const error = document.getElementById('error');

        function formatJSON() {
            error.textContent = '';
            try {
                const obj = JSON.parse(input.value);
                output.value = JSON.stringify(obj, null, 2);
            } catch (e) {
                error.textContent = '❌ JSON 语法错误: ' + e.message;
                output.value = '';
            }
        }

        function compressJSON() {
            error.textContent = '';
            try {
                const obj = JSON.parse(input.value);
                output.value = JSON.stringify(obj);
            } catch (e) {
                error.textContent = '❌ JSON 语法错误: ' + e.message;
                output.value = '';
            }
        }

        function clearAll() {
            input.value = '';
            output.value = '';
            error.textContent = '';
        }
    </script>
</body>
</html>

    <script>
    function copyToClipboard() {
        const output = document.getElementById('output');
        if (output) {
            output.select();
            document.execCommand('copy');
            alert('已复制到剪贴板');
        }
    }
    </script>
    <script>
    const history = JSON.parse(localStorage.getItem('tool_history') || '[]');
    function saveToHistory(input) {
        history.unshift({text: input, time: new Date().toISOString()});
        localStorage.setItem('tool_history', JSON.stringify(history.slice(0, 10)));
    }
    </script>
