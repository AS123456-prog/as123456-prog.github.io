<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="log-tracker.js"></script>
    <title>IP 查询 | 程序员工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 1.8rem; color: #58a6ff; }
        header a { color: #8b949e; font-size: 0.9rem; text-decoration: none; }
        .container { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 1rem; }
        input {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            padding: 0.8rem 1rem;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
        }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #30363d; }
        .primary { background: #238636; border-color: #2ea043; color: #fff; }
        .result {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1.5rem;
            min-height: 100px;
        }
        .result p { margin: 0.4rem 0; }
        .label { color: #8b949e; }
        .value { color: #58a6ff; }
        footer { margin-top: 2rem; color: #484f58; font-size: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <h1>🌍 IP 查询</h1>
        <a href="index.html">← 返回工具箱</a>
    </header>
    <div class="container">
        <input id="ipInput" placeholder="输入 IP 地址（留空查本机出口 IP）">
        <div class="btn-group">
            <button class="primary" onclick="lookupIP()">查询</button>
            <button onclick="clearAll()">清空</button>
        </div>
        <div class="result" id="result">
            <p style="color:#8b949e;">点击“查询”获取 IP 信息</p>
        </div>
    </div>
    <footer>
        &copy; 2026 As123456-prog | 开源在 GitHub
    </footer>
    <script>
        async function lookupIP() {
            const ip = document.getElementById('ipInput').value.trim();
            const url = ip ? `http://ip-api.com/json/${ip}?lang=zh-CN` : `http://ip-api.com/json/?lang=zh-CN`;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>查询中...</p>';
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.status === 'success') {
                    resultDiv.innerHTML = `
                        <p><span class="label">IP：</span><span class="value">${data.query}</span></p>
                        <p><span class="label">国家：</span><span class="value">${data.country}</span></p>
                        <p><span class="label">地区：</span><span class="value">${data.regionName}</span></p>
                        <p><span class="label">城市：</span><span class="value">${data.city}</span></p>
                        <p><span class="label">运营商：</span><span class="value">${data.isp}</span></p>
                        <p><span class="label">经纬度：</span><span class="value">${data.lat}, ${data.lon}</span></p>
                    `;
                } else {
                    resultDiv.innerHTML = '<p style="color:#f85149;">查询失败：' + data.message + '</p>';
                }
            } catch(e) {
                resultDiv.innerHTML = '<p style="color:#f85149;">网络错误，请稍后再试</p>';
            }
        }
        function clearAll() {
            document.getElementById('ipInput').value = '';
            document.getElementById('result').innerHTML = '<p style="color:#8b949e;">点击“查询”获取 IP 信息</p>';
        }
    </script>
</body>
</html>
