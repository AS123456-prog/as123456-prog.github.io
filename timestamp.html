<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间戳转换 | 程序员工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 1.8rem; color: #58a6ff; }
        header a { color: #8b949e; font-size: 0.9rem; text-decoration: none; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1rem; }
        input {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            padding: 0.8rem 1rem;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
        }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #30363d; }
        .primary { background: #238636; border-color: #2ea043; color: #fff; }
        .result {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1.5rem;
            min-height: 80px;
            word-break: break-all;
        }
        .result p { margin: 0.5rem 0; font-size: 0.95rem; }
        .result .label { color: #8b949e; }
        .result .value { color: #58a6ff; font-weight: bold; }
        footer { margin-top: 2rem; color: #484f58; font-size: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <h1>⏰ 时间戳转换</h1>
        <a href="index.html">← 返回工具箱</a>
    </header>
    <div class="container">
        <input id="timestamp" placeholder="输入 Unix 时间戳（秒）或留空点按钮获取当前时间...">
        <div class="btn-group">
            <button class="primary" onclick="convert()">转换为日期</button>
            <button onclick="showNow()">当前时间戳</button>
            <button onclick="clearAll()">清空</button>
        </div>
        <div class="result" id="result">
            <p style="color:#8b949e;">输入时间戳后点击转换，或点击"当前时间戳"</p>
        </div>
    </div>
    <footer>
        &copy; 2026 As123456-prog | 开源在 GitHub
    </footer>
    <script>
        function convert() {
            let ts = document.getElementById('timestamp').value.trim();
            if (!ts) return;
            let tsNum = parseInt(ts);
            if (ts.length > 10) tsNum = Math.floor(tsNum / 1000);
            const date = new Date(tsNum * 1000);
            document.getElementById('result').innerHTML = `
                <p><span class="label">时间戳（秒）：</span><span class="value">${tsNum}</span></p>
                <p><span class="label">北京时间：</span><span class="value">${date.toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'})}</span></p>
                <p><span class="label">UTC：</span><span class="value">${date.toUTCString()}</span></p>
            `;
        }
        function showNow() {
            document.getElementById('timestamp').value = Math.floor(Date.now() / 1000);
            convert();
        }
        function clearAll() {
            document.getElementById('timestamp').value = '';
            document.getElementById('result').innerHTML = '<p style="color:#8b949e;">输入时间戳后点击转换，或点击"当前时间戳"</p>';
        }
    </script>
</body>
</html>
