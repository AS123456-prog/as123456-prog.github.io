<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈希计算 | 程序员工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 1.8rem; color: #58a6ff; }
        header a { color: #8b949e; font-size: 0.9rem; text-decoration: none; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1rem; }
        textarea {
            width: 100%; height: 150px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            resize: vertical;
        }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #30363d; }
        .primary { background: #238636; border-color: #2ea043; color: #fff; }
        .result-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1rem;
        }
        .result-box p { margin: 0.4rem 0; font-size: 0.9rem; word-break: break-all; }
        .label { color: #8b949e; }
        .value { color: #58a6ff; }
        footer { margin-top: 2rem; color: #484f58; font-size: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <h1>🔒 哈希计算</h1>
        <a href="index.html">← 返回工具箱</a>
    </header>
    <div class="container">
        <textarea id="input" placeholder="输入要计算哈希的文本..."></textarea>
        <div class="btn-group">
            <button class="primary" onclick="calcHash('SHA-256')">SHA-256</button>
            <button onclick="calcHash('SHA-1')">SHA-1</button>
            <button onclick="calcHash('MD5')">MD5</button>
            <button onclick="clearAll()">清空</button>
        </div>
        <div class="result-box" id="result">
            <p style="color:#8b949e;">选择一种哈希算法开始计算</p>
        </div>
    </div>
    <footer>
        &copy; 2026 As123456-prog | 开源在 GitHub
    </footer>
    <script>
        async function calcHash(algorithm) {
            const input = document.getElementById('input').value;
            const result = document.getElementById('result');
            const encoder = new TextEncoder();
            const data = encoder.encode(input);
            const hashBuffer = await crypto.subtle.digest(algorithm, data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            result.innerHTML = `
                <p><span class="label">算法：</span><span class="value">${algorithm}</span></p>
                <p><span class="label">哈希值：</span><span class="value">${hashHex}</span></p>
            `;
        }
        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('result').innerHTML = '<p style="color:#8b949e;">选择一种哈希算法开始计算</p>';
        }
    </script>
</body>
</html>
